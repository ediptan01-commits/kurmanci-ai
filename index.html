<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurmancî AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ÜST BAR */
.header {
    height: 70px;
    background: #111821;
    border-bottom: 1px solid #27313d;
    display: flex;
    align-items: center;
    padding: 0 18px;
}

.logo {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    margin-right: 12px;
}

.title-area h1 {
    font-size: 19px;
}

.title-area p {
    font-size: 12px;
    color: #9ca8b5;
    margin-top: 3px;
}

/* SOHBET */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 15px 120px;
}

.welcome {
    text-align: center;
    margin-top: 50px;
}

.welcome-icon {
    width: 70px;
    height: 70px;
    border-radius: 22px;
    margin: auto;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: bold;
}

.welcome h2 {
    margin-top: 18px;
    font-size: 25px;
}

.welcome p {
    color: #9ca8b5;
    margin-top: 8px;
}

.message {
    display: flex;
    margin-bottom: 18px;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 85%;
    padding: 13px 16px;
    border-radius: 18px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user .bubble {
    background: #2563eb;
    border-bottom-right-radius: 5px;
}

.ai .bubble {
    background: #171e27;
    border: 1px solid #293440;
    border-bottom-left-radius: 5px;
}

/* YAZIYOR */
.typing {
    display: none;
    color: #8e9aa7;
    font-size: 14px;
    padding: 5px 10px 15px;
}

.typing span {
    animation: blink 1.2s infinite;
}

@keyframes blink {
    50% {
        opacity: 0.3;
    }
}
