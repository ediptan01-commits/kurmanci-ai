<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurmancî AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #252b33;
      background: #11161d;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      font-size: 20px;
      font-weight: bold;
      margin-right: 12px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      color: #8c96a3;
      margin-top: 3px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 16px 120px;
    }

    .welcome {
      max-width: 700px;
      margin: 70px auto 30px;
      text-align: center;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9aa4b2;
      line-height: 1.6;
    }

    .message {
      max-width: 750px;
      margin: 18px auto;
      display: flex;
      gap: 12px;
    }

    .avatar {
      min-width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1d4ed8;
      font-weight: bold;
    }

    .bubble {
      background: #151b23;
      border: 1px solid #242b35;
      border-radius: 14px;
      padding: 13px 16px;
      line-height: 1.6;
      max-width: calc(100% - 50px);
    }

    .user .bubble {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px;
      background: linear-gradient(transparent, #0b0f14 25%);
    }

    .input-box {
      max-width: 750px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #151b23;
      border: 1px solid #303844;
      border-radius: 18px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 10px;
      min-height: 42px;
      max-height: 120px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
    }

    .send {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #2563eb;
      font-size: 18px;
    }

    .send:active {
      transform: scale(.95);
    }

    @media (max-width: 600px) {
      .welcome h1 {
        font-size: 26px;
      }

      .chat {
        padding-top: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">K</div>

    <div>
      <div class="title">Kurmancî AI</div>
      <div class="subtitle">Alîkarê te yê zîrek</div>
    </div>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>Silav 👋</h1>
      <p>
        Ez Kurmancî AI me.<br>
        Tu dikarî bi Kurmancî bi min re biaxivî.
      </p>
    </div>

  </main>

  <div class="input-area">

    <div class="input-box">

      <textarea
        id="message"
        placeholder="Peyama xwe binivîse..."
        rows="1">
      </textarea>

      <button class="send" onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>

</div>

<script>

function sendMessage() {

  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  // Kullanıcı mesajı
  const userMessage = document.createElement("div");
  userMessage.className = "message user";

  userMessage.innerHTML = `
    <div class="avatar">Tu</div>
    <div class="bubble">${escapeHtml(text)}</div>
  `;

  chat.appendChild(userMessage);

  input.value = "";

  // Şimdilik test cevabı
  setTimeout(() => {

    const aiMessage = document.createElement("div");
    aiMessage.className = "message";

    aiMessage.innerHTML = `
      <div class="avatar">K</div>
      <div class="bubble">
        Ez li vir im. Tu dikarî pirsên xwe bi Kurmancî bipirsî.
      </div>
    `;

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;

  }, 500);

  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(text) {

  const div = document.createElement("div");
  div.textContent = text;

  return div.innerHTML;
}

document.getElementById("message").addEventListener("keydown", function(e) {

  if (e.key === "Enter" && !e.shiftKey) {

    e.preventDefault();
    sendMessage();

  }

});

</script>

</body>
</html>
